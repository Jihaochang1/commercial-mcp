[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foodcalorie-mcp"
version = "0.1.0"
description = "MCP Server for Chinese food calorie and nutrition data - 中国食品营养数据MCP服务器"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jihaochang", email = "358550956@qq.com" }
]
keywords = ["mcp", "food", "nutrition", "calorie", "chinese-food"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
similarity = [
    "numpy>=2.5.1",
    "sentence-transformers>=5.6.1",
]

[project.scripts]
foodcalorie-mcp = "foodcalorie_mcp.server:main"
foodcalorie-license = "foodcalorie_mcp.license_manager:main"

[project.urls]
Homepage = "https://github.com/Jihaochang1/foodcalorie-mcp"
Documentation = "https://github.com/Jihaochang1/foodcalorie-mcp#readme"
Repository = "https://github.com/Jihaochang1/foodcalorie-mcp.git"
Issues = "https://github.com/Jihaochang1/foodcalorie-mcp/issues"
Changelog = "https://github.com/Jihaochang1/foodcalorie-mcp/blob/main/CHANGELOG.md"
"Sponsor" = "https://github.com/sponsors/Jihaochang1"

[tool.hatch.build.targets.wheel]
packages = ["src/foodcalorie_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I"]
